<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
<style>
@import url("https://fonts.googleapis.com/css2?family=Nunito:wght@200;400;700&family=Permanent+Marker&display=swap");

:root {
  --light-clr: #e5e5e5;
  --primary-clr: #6490f6;
  --secondary-clr: #c1daff;
  --active-clr: rgba(149, 153, 186, 0.4);
  --player-bg: rgba(5, 9, 51, 0.4);
  --scrollbar-track: rgb(79, 78, 78);
  --scrollbar-thumb: rgb(116, 116, 116);
}

*,*::before,*::after { box-sizing: border-box; padding: 0; margin: 0; }

img {
  display: block; width: 100%; height: 100%;
  object-fit: cover; user-select: none;
}

h1 { font-size: clamp(0.7rem, 2.5vw, 0.9rem); }
p  { font-size: clamp(0.6rem, 2.5vw, 0.8rem); }

body {
  font-family: "Nunito", sans-serif;
  display: flex; align-items: center; justify-content: center;
  height: 100vh;
  background: #001124;
  background-image: url(https://i.postimg.cc/3xnVYxTF/fondo2.jpg);
  background-repeat: no-repeat; background-size: cover;
}

main {
  position: relative;
  width: 85%; height: 85%;
  max-width: 800px; max-height: 550px;
  background: transparent; border-radius: 15px; overflow: hidden;
}

.content {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: rgba(53, 54, 72, 0.2);
  backdrop-filter: blur(10px);
  border-radius: inherit;
  color: var(--light-clr);
  overflow-y: auto;
  padding: 20px 20px 10px;
}

.content::-webkit-scrollbar { width: 5px; }
.content::-webkit-scrollbar-track {
  box-shadow: inset 0 0 0.3rem var(--scrollbar-track);
  border-radius: 40px; margin: 18px 0;
}
.content::-webkit-scrollbar-thumb {
  box-shadow: inset 0 0 0.5rem var(--scrollbar-thumb);
  background-color: var(--primary-clr); border-radius: 40px;
}

.slider-playlist {
  display: grid;
  grid-template-columns: 40% 60%;
  align-items: center; gap: 20px; width: 100%;
}

.swiper { width: 240px; height: auto; }
.swiper-slide {
  display: grid; grid-template-rows: 4fr 1fr;
  padding: 10px; border-radius: 10px; background-color: #d3d2d6;
}
.swiper-slide img { aspect-ratio: 1/1; border-radius: 5px; margin-bottom: 10px; }
.swiper-slide h1 {
  font-family: "Permanent Marker", serif;
  letter-spacing: 1px; color: #222224;
  transform: rotate(-3deg); margin: auto;
}

.playlist { width: 100%; }
.playlist-item {
  display: grid;
  grid-template-columns: 15% 65% 15% 5%;
  align-items: center;
  padding: 6px 8px; margin-bottom: 10px;
  border-bottom: 1px solid var(--primary-clr);
  cursor: pointer;
}
.playlist-item img { width: 70%; aspect-ratio: 1/1; border-radius: 5px; }
.playlist-item .song p:nth-child(1) { font-weight: 500; margin-bottom: 2px; }
.playlist-item .song p:nth-child(2) { font-weight: 300; opacity: 0.5; }
.active-playlist-item { background-color: var(--active-clr); border-radius: 5px; }

.player {
  position: sticky; bottom: 0; width: 100%;
  border: 1px solid rgba(255,255,255,0.3); border-radius: 10px;
  background: var(--player-bg); backdrop-filter: blur(10px);
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 0 5px;
}

.controls { display: flex; column-gap: 20px; align-items: center; }
.controls i { font-size: 1.4rem; cursor: pointer; }
#playPauseBtn {
  width: 40px; aspect-ratio: 1/1;
  background: var(--light-clr); border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.3);
  color: var(--primary-clr);
  display: flex; align-items: center; justify-content: center;
}
.volume { position: relative; display: flex; align-items: center; }
#volume-range {
  position: absolute; left: 25px; top: 6px;
  width: 100px; background: var(--primary-clr);
  height: 3px; border-radius: 4px;
}
#progress-bar {
  width: 90%; height: 4px;
  background: linear-gradient(90deg, var(--light-clr), var(--secondary-clr), var(--primary-clr));
  border-radius: 4px; margin: 10px 0 12px;
}

@media (max-width: 768px) {
  .slider-playlist { grid-template-columns: 1fr; gap: 30px; }
  .swiper { width: 280px; margin: 0 auto; }
  main { width: 95%; height: 95%; }
  .content { padding: 15px; }
  .playlist-item { grid-template-columns: 20% 60% 15% 5%; }
}

@media (max-width: 480px) {
  h1 { font-size: clamp(0.8rem, 4vw, 1rem); }
  p  { font-size: clamp(0.7rem, 4vw, 0.9rem); }
  .controls { column-gap: 15px; }
  .controls i { font-size: 1.3rem; }
  #playPauseBtn { width: 38px; }
}
</style>
</head>
<body>
<main>
  <div class="content">
    <div class="slider-playlist">

      <!-- Carrusel: se genera automáticamente desde songs.js -->
      <div class="swiper">
        <div class="swiper-wrapper" id="swiperWrapper"></div>
      </div>

      <!-- Lista de reproducción: se genera automáticamente desde songs.js -->
      <div class="playlist" id="playlist"></div>

    </div>

    <!-- Reproductor fijo en la parte inferior -->
    <div class="player">
      <audio id="audioPlayer"></audio>
      <div class="controls">
        <i class="fa-solid fa-shuffle"   id="shuffleBtn"></i>
        <i class="fa-solid fa-backward"  id="prevBtn"></i>
        <button id="playPauseBtn"><i class="fa-solid fa-play" id="playPauseIcon"></i></button>
        <i class="fa-solid fa-forward"   id="nextBtn"></i>
        <div class="volume">
          <i class="fa-solid fa-volume-high"></i>
          <input type="range" id="volume-range" min="0" max="100" value="100">
        </div>
      </div>
      <input type="range" value="0" id="progress-bar">
    </div>
  </div>
</main>

<!-- Primero cargamos la lista de canciones -->
<script src="songs.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script>
// ====== GENERACIÓN AUTOMÁTICA DEL HTML ======
// Lee el array "songs" de songs.js y construye el carrusel y la lista.

const swiperWrapper = document.getElementById("swiperWrapper");
const playlistEl    = document.getElementById("playlist");

songs.forEach((song, i) => {
  // — Slide del carrusel —
  const slide = document.createElement("div");
  slide.className = "swiper-slide";
  slide.innerHTML = `<img src="${song.portada}" alt="${song.titulo}"><h1>${song.titulo}</h1>`;
  swiperWrapper.appendChild(slide);

  // — Fila de la lista —
  const item = document.createElement("div");
  item.className = "playlist-item";
  item.dataset.index = i;
  item.innerHTML = `
    <img src="${song.portada}" alt="${song.titulo}">
    <div class="song">
      <p>${song.titulo}</p>
      <p>${song.artista}</p>
    </div>
    <p>${song.duracion}</p>
    <i class="fa-regular fa-heart like-btn"></i>`;
  playlistEl.appendChild(item);
});

// ====== REPRODUCTOR ======

const playlistItems = document.querySelectorAll(".playlist-item");
const likeBtns      = document.querySelectorAll(".like-btn");
const audioPlayer   = document.getElementById("audioPlayer");
const volumeRange   = document.getElementById("volume-range");
const progressBar   = document.getElementById("progress-bar");
const playPauseBtn  = document.getElementById("playPauseBtn");
const playPauseIcon = document.getElementById("playPauseIcon");
const prevBtn       = document.getElementById("prevBtn");
const nextBtn       = document.getElementById("nextBtn");
const shuffleBtn    = document.getElementById("shuffleBtn");

let currentSongIndex = 0;
let isSongLoaded     = false;

// Inicializa Swiper
const swiper = new Swiper(".swiper", {
  effect: "cards", grabCursor: true, speed: 700, initialSlide: 0
});

swiper.on("slideChange", () => {
  const newIndex = swiper.realIndex;
  if (newIndex !== currentSongIndex) {
    currentSongIndex = newIndex;
    loadAndPlaySong(currentSongIndex);
  }
});

function updatePlaylistHighlight(index) {
  playlistItems.forEach((item, i) =>
    item.classList.toggle("active-playlist-item", i === index)
  );
}

function loadAndPlaySong(index) {
  audioPlayer.src = songs[index].mp3;
  audioPlayer.play().catch(e => console.error("Error al reproducir:", e));
  updatePlayPauseIcon(true);
  updatePlaylistHighlight(index);
  swiper.slideTo(index);
  isSongLoaded = true;
}

function updatePlayPauseIcon(isPlaying) {
  playPauseIcon.classList.toggle("fa-pause", isPlaying);
  playPauseIcon.classList.toggle("fa-play",  !isPlaying);
}

function togglePlayPause() {
  if (!isSongLoaded) {
    loadAndPlaySong(currentSongIndex);
  } else if (audioPlayer.paused) {
    audioPlayer.play(); updatePlayPauseIcon(true);
  } else {
    audioPlayer.pause(); updatePlayPauseIcon(false);
  }
}

function nextSong() {
  currentSongIndex = (currentSongIndex + 1) % songs.length;
  loadAndPlaySong(currentSongIndex);
}
function prevSong() {
  currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
  loadAndPlaySong(currentSongIndex);
}

// Eventos de la lista
playlistItems.forEach((item, index) =>
  item.addEventListener("click", () => { currentSongIndex = index; loadAndPlaySong(index); })
);

playPauseBtn.addEventListener("click", togglePlayPause);
nextBtn.addEventListener("click", nextSong);
prevBtn.addEventListener("click", prevSong);

audioPlayer.addEventListener("loadedmetadata", () => { progressBar.max = audioPlayer.duration; });
audioPlayer.addEventListener("timeupdate",      () => { if (!audioPlayer.paused) progressBar.value = audioPlayer.currentTime; });
progressBar.addEventListener("input",           () => { audioPlayer.currentTime = progressBar.value; });
volumeRange.addEventListener("input",           () => { audioPlayer.volume = volumeRange.value / 100; });
audioPlayer.addEventListener("ended", nextSong);

shuffleBtn.addEventListener("click", () => {
  let randomIndex = Math.floor(Math.random() * songs.length);
  if (randomIndex === currentSongIndex) randomIndex = (randomIndex + 1) % songs.length;
  currentSongIndex = randomIndex;
  loadAndPlaySong(currentSongIndex);
});

likeBtns.forEach(btn => btn.addEventListener("click", e => {
  e.stopPropagation();
  btn.classList.toggle("fa-solid");
  btn.classList.toggle("fa-regular");
}));
</script>
</body>
</html>
